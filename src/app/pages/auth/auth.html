<div class="auth-page relative">
  <div class="absolute top-4 right-4 z-10">
    <app-language-switcher></app-language-switcher>
  </div>
  @if (auth === 'login') {
    <app-login (changeAuth)="changeAuth($event)"></app-login>
  } @else if (auth === 'register') {
    <app-register (changeAuth)="changeAuth($event)"></app-register>
  }
</div>
