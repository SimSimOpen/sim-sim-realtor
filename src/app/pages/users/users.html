<div class="users-page">
  <section class="title flex justify-between">
    <div>
      <h1 class="text-2xl text-black font-bold">Users</h1>
      <span>Manage your application users.</span>
    </div>
    <div class="flex items-center">
      <button
        class="bg-blue-700 gap-3 text-white shadow-sm py-2 px-5 font-semibold hover:shadow-md hover:bg-blue-800 flex items-center space-x-1"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-user-plus h-4 w-4"
          aria-hidden="true"
          data-id="element-1099"
        >
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <line x1="19" x2="19" y1="8" y2="14"></line>
          <line x1="22" x2="16" y1="11" y2="11"></line>
        </svg>
        Add Admin
      </button>
    </div>
  </section>

  <section class="users-table shadow-sm">
    <table class="w-full">
      <thead class="text-gray-500 text-xs text-light uppercase border-b border-gray-300">
        <tr class="text-left">
          <th>User</th>
          <th>Phone</th>
          <th>Role</th>
          <th>Status</th>
          <th>Last Active</th>
          <th>Date Joined</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users; track $index) {
          <tr class="border-b border-gray-300 last:border-b-0 hover:bg-gray-50 cursor-defualt">
            <td>
              <div class="flex items-center gap-4">
                <div class="border border-gray-300 rounded-full p-1">
                  @if (false) {
                    <img
                      class="h-24 w-24 object-cover border border-gray-200"
                      [src]=""
                      alt="agent-image"
                    />
                  } @else {
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="30"
                      height="30"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="icon icon-tabler icons-tabler-outline icon-tabler-user"
                    >
                      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                      <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
                      <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
                    </svg>
                  }
                </div>
                <div>
                  <div class="text-md font-medium text-gray-900">{{ user.name }}</div>
                  <div class="flex items-center text-gray-700 text-sm">
                    {{ user.email }}
                  </div>
                </div>
              </div>
            </td>
            <td class="text-gray-700">{{ user.phone }}</td>
            <td>
              <div class="capitalize text-sm font-medium text-gray-600">
                <span [ngClass]="getRoleClass(user)">
                  {{ user.role }}
                </span>
              </div>
            </td>
            <td class="capitalize text-sm font-medium text-gray-900">
              <span [ngClass]="getStatusClass(user)">
                {{ user.status }}
              </span>
            </td>
            <td class="text-gray-700">{{ user.lastActive }}</td>
            <td class="text-gray-700">{{ user.dateJoined }}</td>

            <td>
              <div class="flex gap-1 items-center justify-start">
                <button
                  class="p-2 cursor-pointer text-gray-400 hover:text-gray-600 hover:bg-blue-50 rounded-md transition-colors"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-eye h-4 w-4"
                    aria-hidden="true"
                    data-id="element-256"
                  >
                    <path
                      d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
                <button
                  class="p-2 cursor-pointer text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-md transition-colors"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-pen h-4 w-4"
                    aria-hidden="true"
                    data-id="element-258"
                  >
                    <path
                      d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
                    ></path>
                  </svg>
                </button>
                <button
                  class="p-2 cursor-pointer text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-colors"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-trash2 lucide-trash-2 h-4 w-4"
                    aria-hidden="true"
                    data-id="element-260"
                  >
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                    <line x1="10" x2="10" y1="11" y2="17"></line>
                    <line x1="14" x2="14" y1="11" y2="17"></line>
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</div>
