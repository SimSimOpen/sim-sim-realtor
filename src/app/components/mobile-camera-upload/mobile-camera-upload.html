<div class="mobile-camera-page">
  @if (sessionStatus === 'Loading') {
    <div class="flex items-center justify-center h-screen">
      <p class="text-red-500 text-lg">Checking session...</p>
    </div>
  } @else if (sessionStatus === 'Expired') {
    <div class="expired-message">
      <p class="text-red-500 text-lg">Session has expired. Please try again.</p>
    </div>
  } @else {
    <video
      #video
      autoplay
      playsinline
      class="screen rounded"
      [style.display]="stream ? 'block' : 'none'"
    ></video>
    <span
      (click)="closeTab()"
      class="absolute top-5 cursor-pointer right-5 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center z-999"
    >
      ✕
    </span>

    @if (stream && !previewUrl) {
      <div class="absolute bottom-60 flex gap-2 mt-3">
        <button (click)="takePhoto()" class="capture-button"></button>
      </div>
    }
    @if (previewUrl && previewBlob) {
      <div class="blur-bakcground"></div>
      <img [src]="previewUrl" class="mt-3 previews border border-blue-500 rounded" />
      <div class="previews flex gap-2 mt-2">
        <button (click)="uploadCapturedPhoto()">Use & Upload</button>
        <button (click)="discard()">Retake</button>
      </div>
    }
    <div class="absolute bottom-50">
      @if (property && property.medias && !previewUrl && !previewBlob) {
        <app-uploaded-files-mobile
          [medias]="property.medias"
          [token]="token"
          (addMoreMedias)="uploadFile($event)"
        ></app-uploaded-files-mobile>
      }
    </div>
  }
</div>
